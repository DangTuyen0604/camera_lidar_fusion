controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.30
      # A safety-limited in-place turn changes heading but not XY. Do not
      # trigger recovery while the robot is still turning onto a detour.
      movement_time_allowance: 45.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Docking staging is geometric, not merely a coarse navigation goal.
      # Arrive close and aligned enough for the graceful controller to follow
      # the 0.70 m straight approach instead of accepting a diagonal start.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.20
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # A persistent obstacle can force a large heading change after the
      # global path is replanned. Allow an in-place turn so Collision Monitor
      # can evaluate that safe rotation separately from forward motion.
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.60
      rotate_to_heading_min_angle: 0.50

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    # Recovery collision checks consume the local costmap; both must express
    # candidate poses in the same frame or Spin reports "Pose Goes Off Grid".
    local_frame: map
    global_frame: map
    robot_base_frame: base_link
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # BT action nodes wait this long (ms) for planner/controller to accept a
    # goal. The 20 ms default fails under simulation + perception load and
    # aborts the whole NavigateToPose.
    default_server_timeout: 200

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.5]
    max_decel: [-1.5, 0.0, -2.5]
    odom_topic: /odom

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan_filtered
    min_particles: 500
    max_particles: 2000
    # Wheel odometry accumulates noticeable slip on the simulated floor. Docking
    # moves only 0.7 m at low speed, so 0.20 m / 0.20 rad thresholds allowed
    # map->odom to jump several times during one approach. Use frequent,
    # beam-rich corrections so the map-frame dock does not move relative to
    # the physical station.
    update_min_d: 0.05
    update_min_a: 0.05
    max_beams: 180
    laser_model_type: likelihood_field_prob
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.20
    z_hit: 0.80
    z_rand: 0.20
    # Measured MuJoCo odometry error is <=2% (in-place spins scrub ~1.8%).
    # 0.35 let the particle cloud spread ~35% per turn, so the AMCL yaw
    # wandered during every rotation and the map-frame local costmap smeared
    # walls. Keep a margin over the real error without that wander.
    alpha1: 0.10
    alpha2: 0.10
    alpha3: 0.10
    alpha4: 0.10
    alpha5: 0.20
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: -4.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      # The simulated stations are fixed in map and AMCL can correct
      # map->odom during a low-speed approach. Keep the rolling window in map
      # so its collision checker and the physical dock target cannot diverge.
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.32
      plugins: ["obstacle_layer", "detection_layer", "inflation_layer"]
      # The LiDAR marks into a decaying voxel layer instead of Nav2's
      # raytrace-cleared ObstacleLayer. With the robot standing still (docked,
      # at a staging pose, turning in place) every beam keeps the same angle,
      # and the Bresenham line of a beam that later reaches the wall does not
      # pass through the cell where the same beam hit a passing worker, so
      # that cell was never cleared: workers left permanent trails until the
      # robot drove off. Every return is re-marked at 10 Hz, so walls and
      # present obstacles stay solid while anything no longer seen expires.
      obstacle_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          marking: true
          clearing: false
          # The controller looks <1 m ahead; far marks only add smear from
          # heading error during turns.
          obstacle_range: 3.5
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "none"
          voxel_min_points: 0
          clear_after_reading: true
      # Camera-LiDAR detections live in their own layer whose cells expire
      # 0.5 s after the last detection. Raytrace clearing in the obstacle
      # layer depended on every clearing message landing in time; one missed
      # batch left a whole 0.6 m worker footprint behind as a ghost. Detections arrive at ~12 Hz (p90 gap 0.25 s).
      detection_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: false
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        observation_sources: detections
        detections:
          topic: /navigation/detection_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_range: 30.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "none"
          voxel_min_points: 0
          clear_after_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.32
      plugins: ["static_layer", "obstacle_layer", "detection_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          # Beams with no return within 10 m are inf. Nav2 drops them unless
          # inf_is_valid, and then nothing along that beam is ever cleared:
          # workers and removed boxes leave permanent ghost trails.
          inf_is_valid: true
          clearing: true
          marking: true
          # Walls come from the static layer; the scan only adds dynamic
          # obstacles, so far marks only add heading-error smear.
          obstacle_max_range: 5.0
          raytrace_max_range: 10.0
      # Camera-LiDAR detections live in their own layer whose cells expire
      # 1.0 s after the last detection. Raytrace clearing in the obstacle
      # layer depended on every clearing message landing in time; one missed
      # batch left a whole 0.6 m worker footprint behind as a ghost. The planner map updates at 2 Hz, so keep marks for two cycles.
      detection_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: false
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        observation_sources: detections
        detections:
          topic: /navigation/detection_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_range: 30.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "none"
          voxel_min_points: 0
          clear_after_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor
      - docking_server

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [map_server, amcl]

dynamic_yield:
  ros__parameters:
    use_sim_time: true
    # A moving obstacle (unmapped LiDAR cluster faster than moving_speed)
    # within stop_distance ahead stops the robot until none is within
    # resume_distance for clear_hold s, or max_wait s pass (then Nav2 routes
    # around it).  It stays "moving" for memory_time s after it pauses.
    moving_speed: 0.35
    memory_time: 3.0
    stop_distance: 1.0
    resume_distance: 1.5
    clear_hold: 1.0
    max_wait: 10.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    # dynamic_yield (stop-and-wait for moving obstacles) sits in front.
    cmd_vel_in_topic: cmd_vel_yield
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons: [StopZone, SlowZone]
    StopZone:
      # Predict collision along the requested motion. Unlike a fixed stop
      # box, this blocks forward motion but permits a collision-free in-place
      # turn onto a replanned path.
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.05
      min_points: 2
      visualize: true
      enabled: true
    SlowZone:
      type: polygon
      points: "[[1.10, 0.50], [1.10, -0.50], [-0.40, -0.50], [-0.40, 0.50]]"
      action_type: slowdown
      slowdown_ratio: 0.40
      min_points: 2
      visualize: true
      enabled: true
    observation_sources: [scan, detection_obstacles]
    scan:
      type: scan
      topic: /scan_filtered
      enabled: true
    detection_obstacles:
      type: pointcloud
      topic: /navigation/detection_obstacles
      min_height: 0.05
      max_height: 2.0
      use_global_height: false
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 30.0
    initial_perception_timeout: 5.0
    # The safety chain can reduce the final approach to about 0.02 m/s near
    # the physical dock. Allow that constrained motion to finish instead of
    # timing out and starting a recovery while the robot is still converging.
    dock_approach_timeout: 180.0
    max_retries: 3
    base_frame: base_link
    # CostmapTopicCollisionChecker does not transform poses. This must exactly
    # match local_costmap.global_frame. Keeping both in map also avoids
    # freezing a dock target in odom while AMCL corrects map->odom.
    fixed_frame: map
    dock_backwards: false
    dock_prestaging_tolerance: 0.15
    dock_plugins: [warehouse_dock]
    warehouse_dock:
      plugin: opennav_docking::SimpleChargingDock
      # The map-frame pose moves by several centimetres when AMCL corrects at
      # very low speed. Use Nav2's 5 cm precision default, leaving a 3 cm
      # margin for the independent 8 cm / 5 degree / stopped / collision-free
      # mission contract after the velocity smoother settles.
      docking_threshold: 0.05
      staging_x_offset: -0.70
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    docks: [HOME, S1_STORAGE, S2_ASSEMBLY, S3_INSPECTION, S4_PACKAGING]
    HOME: {type: warehouse_dock, frame: map, pose: [0.0, -4.0, 1.57]}
    S1_STORAGE: {type: warehouse_dock, frame: map, pose: [-6.27, 3.5, 0.0]}
    S2_ASSEMBLY: {type: warehouse_dock, frame: map, pose: [-2.27, 3.5, 0.0]}
    S3_INSPECTION: {type: warehouse_dock, frame: map, pose: [2.27, 3.5, 3.14]}
    S4_PACKAGING: {type: warehouse_dock, frame: map, pose: [6.27, 3.5, 3.14]}
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.04
      v_linear_max: 0.12
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      # The configured dock pose is the robot contact pose, so the circular
      # footprint necessarily touches the station occupancy in the last part
      # of the approach. Keep collision prediction everywhere else and use
      # Nav2's dedicated contact-zone exception only within that geometry.
      dock_collision_threshold: 0.45
