controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.30
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.20
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_rotate_to_heading: false

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.5]
    max_decel: [-1.5, 0.0, -2.5]
    odom_topic: /odom

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000
    # Keep the projected demo map stable while odometry performs the initial
    # in-place turn; the real SLAM-saved map may use tighter update thresholds.
    update_min_d: 0.50
    update_min_a: 6.28
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: -4.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.32
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan detection_obstacles detection_clearing
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 9.0
          raytrace_max_range: 10.0
        detection_obstacles:
          topic: /navigation/detection_obstacles
          data_type: PointCloud2
          clearing: false
          marking: true
          obstacle_max_range: 30.0
          observation_persistence: 0.0
        detection_clearing:
          topic: /navigation/detection_obstacles/clearing
          data_type: PointCloud2
          clearing: true
          marking: false
          raytrace_max_range: 31.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.32
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan detection_obstacles detection_clearing
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 9.0
          raytrace_max_range: 10.0
        detection_obstacles:
          topic: /navigation/detection_obstacles
          data_type: PointCloud2
          clearing: false
          marking: true
          obstacle_max_range: 30.0
          observation_persistence: 0.0
        detection_clearing:
          topic: /navigation/detection_obstacles/clearing
          data_type: PointCloud2
          clearing: true
          marking: false
          raytrace_max_range: 31.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor
      - docking_server

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [map_server, amcl]

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons: [StopZone, SlowZone]
    StopZone:
      type: polygon
      points: "[[0.55, 0.28], [0.55, -0.28], [0.15, -0.28], [0.15, 0.28]]"
      action_type: stop
      min_points: 3
      visualize: true
      enabled: true
    SlowZone:
      type: polygon
      points: "[[1.00, 0.45], [1.00, -0.45], [0.10, -0.45], [0.10, 0.45]]"
      action_type: slowdown
      slowdown_ratio: 0.25
      min_points: 3
      visualize: true
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 30.0
    initial_perception_timeout: 5.0
    dock_approach_timeout: 30.0
    max_retries: 3
    base_frame: base_link
    fixed_frame: map
    dock_backwards: false
    dock_prestaging_tolerance: 0.35
    dock_plugins: [warehouse_dock]
    warehouse_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.08
      staging_x_offset: -0.70
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    docks: [HOME, S1_STORAGE, S2_ASSEMBLY, S3_INSPECTION, S4_PACKAGING]
    HOME: {type: warehouse_dock, frame: map, pose: [0.0, -4.0, 1.57]}
    S1_STORAGE: {type: warehouse_dock, frame: map, pose: [-6.0, 3.5, 0.0]}
    S2_ASSEMBLY: {type: warehouse_dock, frame: map, pose: [-2.0, 3.5, 0.0]}
    S3_INSPECTION: {type: warehouse_dock, frame: map, pose: [2.0, 3.5, 3.14]}
    S4_PACKAGING: {type: warehouse_dock, frame: map, pose: [6.0, 3.5, 3.14]}
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.04
      v_linear_max: 0.12
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
