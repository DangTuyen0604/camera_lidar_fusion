name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS2CLI_DISABLE_DAEMON: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Jazzy
        # 0.7.16+ resolves the latest ros-apt-source through an unauthenticated
        # GitHub API request, which can be rate-limited on hosted runners.
        uses: ros-tooling/setup-ros@0.7.15
        with:
          required-ros-distributions: jazzy

      - name: Install ROS dependencies
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          sudo rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y

      - name: Install Python dependencies
        shell: bash
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -c "import cv2, matplotlib, numpy, onnxruntime, pandas, pytest, ultralytics, yaml"

      - name: Build all packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: Configure isolated ROS domain
        shell: bash
        run: |
          key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${RUNNER_NAME}"
          checksum="$(printf '%s' "$key" | cksum | awk '{print $1}')"
          domain_id=$((20 + checksum % 80))
          echo "ROS_TEST_DOMAIN_ID=$domain_id" >> "$GITHUB_ENV"
          echo "Using ROS domain: $domain_id"

      - name: Run core and warehouse smoke tests
        shell: bash
        run: ./scripts/run_tests.sh --ctest-args -E test_warehouse_end_to_end

      - name: Enforce critical skip gate
        shell: bash
        run: python3 tools/classify_skips.py

      - name: Run full warehouse end-to-end test
        shell: bash
        run: >-
          ./scripts/run_tests.sh
          --packages-select system_tests
          --ctest-args -R test_test_warehouse_end_to_end.py

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-results
          path: build/**/test_results/**/*.xml
          if-no-files-found: warn
          retention-days: 14
