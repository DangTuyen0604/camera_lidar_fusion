name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: 125
      ROS2CLI_DISABLE_DAEMON: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Jazzy
        # 0.7.16+ resolves the latest ros-apt-source through an unauthenticated
        # GitHub API request, which can be rate-limited on hosted runners.
        uses: ros-tooling/setup-ros@0.7.15
        with:
          required-ros-distributions: jazzy

      - name: Install ROS dependencies
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y

      - name: Install Python dependencies
        shell: bash
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build all packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: Test all packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          test_status=0
          colcon test --event-handlers console_direct+ || test_status=$?
          result_status=0
          colcon test-result --verbose || result_status=$?
          if [[ "$test_status" -ne 0 ]]; then exit "$test_status"; fi
          exit "$result_status"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-results
          path: build/**/test_results/**/*.xml
          if-no-files-found: warn
          retention-days: 14
